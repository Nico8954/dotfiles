"$schema" = "https://starship.rs/config-schema.json"
# Prompt used inside jj repos (incl. colocated). fish switches STARSHIP_CONFIG
# to this file on cd (fish/conf.d/starship-jj.fish). Base: starship.toml.

palette = "catppuccin_mocha"
format = "$directory$jj_bookmark$jj_change$jj_status$jj_metrics$all"

[jj_bookmark]
symbol = " "
style = "bold mauve"

[jj_change]
format = "$change "

[jj_status]
style = "bold red"

# In a colocated repo git only sees a detached HEAD; hide it.
[git_branch]
disabled = true
[git_commit]
disabled = true
[git_state]
disabled = true
[git_status]
disabled = true
[git_metrics]
disabled = true

